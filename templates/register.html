{% extends "base.html" %}

{% block title %}Create account — Social Feed{% endblock %}

{% block content %}
    <section class="auth-card">
        <h1>Create an account</h1>
        <p class="subtitle">Join your community and share your first post.</p>

        {% if error %}
            <p class="form-error" role="alert">{{ error }}</p>
        {% endif %}

        <form method="post">
            <label for="username">Username</label>
            <input type="text" name="username" id="username"
                   autocomplete="username" minlength="3"
                   value="{{ request.form.get('username', '') }}" required>

            <label for="email">Email</label>
            <input type="email" name="email" id="email"
                   autocomplete="email"
                   value="{{ request.form.get('email', '') }}" required>

            <label for="password">Password — at least 8 characters</label>
            <input type="password" name="password" id="password"
                   autocomplete="new-password" minlength="8" required>

            <button type="submit">Create account</button>
        </form>

        <p>Already registered? <a href="/login">Log in</a></p>
    </section>
{% endblock %}
