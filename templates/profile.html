{% extends "base.html" %}

{% block title %}{{ user["username"] }} — Social Feed{% endblock %}

{% block content %}
    <h1>{{ user["username"] }}</h1>
    <p class="subtitle">Posts shared with the community.</p>

    <h2>Posts</h2>

    {% for post in posts %}
        <article>
            <p>{{ post["content"] }}</p>
        </article>
    {% else %}
        <p>No posts yet.</p>
    {% endfor %}

    <p><a href="{{ url_for('home') }}">Back to feed</a></p>
{% endblock %}
