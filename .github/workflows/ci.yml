name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: social_test
          POSTGRES_USER: social_user
          POSTGRES_PASSWORD: local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U social_user -d social_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check shell scripts
        run: shellcheck scripts/*.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      
      - name: Check dependencies for known vulnerabilities
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Build Docker image
        run: docker build --platform linux/amd64 -t social-app:latest .

      - name: Report image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.74.0'
          image-ref: 'social-app:latest'
          scanners: 'vuln'
          format: 'table'
          ignore-unfixed: false
          exit-code: '0'

      - name: Block fixable high-severity image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.74.0'
          image-ref: 'social-app:latest'
          scanners: 'vuln'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
      - name: Start container for smoke test
        run: |
          docker run -d \
            --name social-app-smoke \
            -p 127.0.0.1:5001:5000 \
            social-app:latest

      - name: Check container health
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:5001/health; then
              echo "Container health check passed"
              exit 0
            fi
            sleep 2
          done

          echo "Container failed to become healthy"
          exit 1

      - name: Show container logs and clean up
        if: always()
        run: |
          if docker container inspect social-app-smoke > /dev/null 2>&1; then
            docker logs social-app-smoke
            docker rm -f social-app-smoke
          fi

      - name: Save scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save --output "$RUNNER_TEMP/social-app.tar" social-app:latest

      - name: Upload scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: social-app-image
          path: ${{ runner.temp }}/social-app.tar
          retention-days: 1
          if-no-files-found: error
    
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://socialapplab.xyz

    permissions:
      id-token: write
      contents: read

    concurrency:
      group: deploy-social-app
      cancel-in-progress: false

    steps:
      - name: Download scanned image
        uses: actions/download-artifact@v4
        with:
          name: social-app-image
          path: ${{ runner.temp }}

      - name: Load scanned image
        run: docker load --input "$RUNNER_TEMP/social-app.tar"
      

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Tag and push scanned image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag social-app:latest "$REGISTRY/social-app:$IMAGE_TAG"
          docker tag social-app:latest "$REGISTRY/social-app:latest"

          docker push "$REGISTRY/social-app:$IMAGE_TAG"
          docker push "$REGISTRY/social-app:latest"

      - name: Register immutable task definition
        env:
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/social-app:${{ github.sha }}
        run: |
          aws ecs describe-task-definition \
            --task-definition social-app \
            --query taskDefinition \
            > task-definition.json

          jq --arg image "$IMAGE_URI" \
            '.containerDefinitions[0].image = $image
             | del(
                 .taskDefinitionArn,
                 .revision,
                 .status,
                 .requiresAttributes,
                 .compatibilities,
                 .registeredAt,
                 .registeredBy
               )' \
            task-definition.json > new-task-definition.json

          TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "TASK_DEFINITION_ARN=$TASK_DEFINITION_ARN" >> "$GITHUB_ENV"

      - name: Deploy ECS service
        run: |
          aws ecs update-service \
            --cluster social-app \
            --service social-app \
            --task-definition "$TASK_DEFINITION_ARN" \
            --query 'service.serviceName' \
            --output text

      - name: Read ECS desired count
        run: |
          DESIRED_COUNT=$(aws ecs describe-services \
            --cluster social-app \
            --services social-app \
            --query 'services[0].desiredCount' \
            --output text)

          if [[ ! "$DESIRED_COUNT" =~ ^[0-9]+$ ]]; then
            echo "Could not read a valid ECS desired count." >&2
            exit 1
          fi

          echo "ECS desired count: $DESIRED_COUNT"
          echo "ECS_DESIRED_COUNT=$DESIRED_COUNT" >> "$GITHUB_ENV"

      - name: Wait for ECS service stability
        if: env.ECS_DESIRED_COUNT != '0'
        run: |
          aws ecs wait services-stable \
            --cluster social-app \
            --services social-app

      - name: Verify deployment result
        run: |
          aws ecs describe-services \
            --cluster social-app \
            --services social-app \
            --output json > service-result.json

          jq -e --arg expected "$TASK_DEFINITION_ARN" '
            (.failures | length) == 0 and
            (.services | length) == 1 and
            (.services[0].status == "ACTIVE") and
            (.services[0].taskDefinition == $expected)
          ' service-result.json > /dev/null || {
            echo "Service is missing, inactive, or using an unexpected task definition." >&2
            exit 1
          }

          DESIRED_COUNT=$(jq -r '.services[0].desiredCount' service-result.json)

          if [[ "$DESIRED_COUNT" == "0" ]]; then
            {
              echo "### Release prepared; runtime verification deferred"
              echo "ECS is scaled to zero. The service points to the new revision."
              echo "Task definition: $TASK_DEFINITION_ARN"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          jq -e --arg expected "$TASK_DEFINITION_ARN" '
            .services[0] |
            (.desiredCount > 0) and
            (.runningCount == .desiredCount) and
            (.pendingCount == 0) and
            (.deployments | length == 1) and
            (.deployments[0].taskDefinition == $expected) and
            (.deployments[0].rolloutState == "COMPLETED")
          ' service-result.json > /dev/null || {
            echo "The intended deployment has not completed with the expected task count." >&2
            exit 1
          }

          {
            echo "### ECS deployment verified"
            echo "The intended revision completed its ECS rollout."
            echo "Running tasks: $DESIRED_COUNT"
            echo "Task definition: $TASK_DEFINITION_ARN"
          } >> "$GITHUB_STEP_SUMMARY"