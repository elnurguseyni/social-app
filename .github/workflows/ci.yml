name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

      - name: Create test database
        env:
          PGPASSWORD: local_password
        run: |
          psql \
            -h localhost \
            -U social_user \
            -d social_db \
            -c "CREATE DATABASE social_test;"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Build Docker image
        run: docker build -t social-app .

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: social_db
          POSTGRES_USER: social_user
          POSTGRES_PASSWORD: local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U social_user -d social_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5