name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: social_test
          POSTGRES_USER: social_user
          POSTGRES_PASSWORD: local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U social_user -d social_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      
      - name: Check dependencies for known vulnerabilities
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Build Docker image
        run: docker build --platform linux/amd64 -t social-app:latest .

      - name: Report image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.74.0'
          image-ref: 'social-app:latest'
          scanners: 'vuln'
          format: 'table'
          ignore-unfixed: false
          exit-code: '0'

      - name: Block fixable high-severity image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.74.0'
          image-ref: 'social-app:latest'
          scanners: 'vuln'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Save scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save --output "$RUNNER_TEMP/social-app.tar" social-app:latest

      - name: Upload scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: social-app-image
          path: ${{ runner.temp }}/social-app.tar
          retention-days: 1
          if-no-files-found: error
    
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://socialapplab.xyz

    permissions:
      id-token: write
      contents: read

    concurrency:
      group: deploy-social-app
      cancel-in-progress: false

    steps:
      - name: Download scanned image
        uses: actions/download-artifact@v4
        with:
          name: social-app-image
          path: ${{ runner.temp }}

      - name: Load scanned image
        run: docker load --input "$RUNNER_TEMP/social-app.tar"
      

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Tag and push scanned image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag social-app:latest "$REGISTRY/social-app:$IMAGE_TAG"
          docker tag social-app:latest "$REGISTRY/social-app:latest"

          docker push "$REGISTRY/social-app:$IMAGE_TAG"
          docker push "$REGISTRY/social-app:latest"

      - name: Register immutable task definition
        env:
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/social-app:${{ github.sha }}
        run: |
          aws ecs describe-task-definition \
            --task-definition social-app \
            --query taskDefinition \
            > task-definition.json

          jq --arg image "$IMAGE_URI" \
            '.containerDefinitions[0].image = $image
             | del(
                 .taskDefinitionArn,
                 .revision,
                 .status,
                 .requiresAttributes,
                 .compatibilities,
                 .registeredAt,
                 .registeredBy
               )' \
            task-definition.json > new-task-definition.json

          TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "TASK_DEFINITION_ARN=$TASK_DEFINITION_ARN" >> "$GITHUB_ENV"

      - name: Deploy ECS service
        run: |
          aws ecs update-service \
            --cluster social-app \
            --service social-app \
            --task-definition "$TASK_DEFINITION_ARN" \
            --query 'service.serviceName' \
            --output text